name: macOS

# Keep this workflow manual-only. The stable-diffusion.cpp Metal artifact
# aborts on GitHub's hosted Apple Silicon runner during pkg/sd native API
# tests, even though the same release passes on newer local Apple hardware.
# Restore pull_request and push triggers only after the hosted runner passes
# the complete package suite without a native SIGABRT.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macOS Apple Silicon. leejet's Darwin artifact ships a universal,
# Metal-capable libstable-diffusion dylib with ggml linked into it, so no
# sibling libraries or DYLD_LIBRARY_PATH are required.

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install malina command
        run: go install .

      - name: Install stable-diffusion.cpp libraries
        # No -v: `malina install` falls back to download.DefaultSDVersion
        # baked into pkg/download. CI never silently tracks leejet's latest
        # tag — bumping that constant in code is the rollover.
        run: malina install -lib $GITHUB_WORKSPACE/lib

      - name: Set MALINA_LIB
        run: echo "MALINA_LIB=$GITHUB_WORKSPACE/lib" >> "$GITHUB_ENV"

      - name: Build examples
        run: |
          set -e
          for dir in ./examples/*/; do
            if [ -f "$dir/main.go" ]; then
              echo "Building $dir..."
              go build -o /dev/null "$dir"
            fi
          done

      - name: Run tests (model-backed tests excluded)
        run: go test -count=1 ./...

      - name: Run sd-encode example
        run: go run ./examples/sd-encode -i samples/frames -fps 24 -secs 1 -o /tmp/out.avi
