name: macOS

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

# Disabled on PR/push until upstream leejet/stable-diffusion.cpp ships a
# Metal kernel for the GGML_OP_NORM op that the current pinned build
# (master-669-2d40a8b) emits in the CLIP path. On the GitHub-hosted M1
# runner the ggml graph optimizer does not fuse NORM away, so dispatch
# hits a missing case in ggml_metal_op_encode_impl and aborts inside
# CLIPTextModelRunner::compute. Newer Apple Silicon (M2+) fuses the op
# and runs fine, so local verification on developer hardware is the
# interim signal. Restore the pull_request + push triggers below once
# the pinned DefaultSDVersion is bumped to a build that includes the
# upstream Metal NORM kernel.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# macOS Apple Silicon. leejet's Darwin asset ships libstable-diffusion as
# a Metal-capable dylib alongside its ggml siblings. No DYLD_LIBRARY_PATH
# is needed — the dylib's RUNPATH resolves sibling libraries from the same
# directory.

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Go version pin
        run: ./.github/scripts/check-go-version.sh

      - name: Setup Malina native environment
        uses: ./.github/actions/setup-malina

      - name: Build examples
        run: |
          set -e
          for dir in ./examples/*/; do
            if [ -f "$dir/main.go" ]; then
              echo "Building $dir..."
              go build -o /dev/null "$dir"
            fi
          done

      - name: Run unit tests
        run: go test -count=1 ./...

      - name: Run hello example
        run: go run ./examples/hello "a lovely cat"

      - name: Run sd-encode example
        run: go run ./examples/sd-encode -i examples/samples/frames -fps 24 -secs 1 -o /tmp/out.avi
