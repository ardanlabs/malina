name: Windows

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows x64. leejet ships stable-diffusion.dll alongside ggml-*.dll in
# the win-avx2-x64 zip. Adding the lib directory to PATH lets the OS
# resolve those sibling DLLs when stable-diffusion.dll is loaded.

jobs:
  test:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install vcredist
        shell: pwsh
        run: |
          curl -o VC_redist.x64.exe -L https://aka.ms/vs/17/release/vc_redist.x64.exe
          Start-Process VC_redist.x64.exe -ArgumentList "/install /quiet /norestart" -Wait

      - name: Install malina command
        run: go install .

      - name: Install stable-diffusion.cpp libraries
        # No -v: `malina install` falls back to download.DefaultSDVersion
        # baked into pkg/download. CI never silently tracks leejet's latest
        # tag — bumping that constant in code is the rollover.
        run: malina install -lib ${env:GITHUB_WORKSPACE}/lib

      - name: Set MALINA_LIB and PATH
        # stable-diffusion.dll loads ggml-*.dll from the same directory;
        # add it to PATH so they are discoverable.
        run: |
          echo "${env:GITHUB_WORKSPACE}/lib" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          echo "MALINA_LIB=${env:GITHUB_WORKSPACE}/lib" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build examples
        shell: bash
        run: |
          set -e
          for dir in ./examples/*/; do
            if [ -f "$dir/main.go" ]; then
              echo "Building $dir..."
              go build -o /dev/null "$dir"
            fi
          done

      - name: Run tests (model-backed tests excluded)
        run: go test -count=1 ./...

      - name: Run sd-encode example
        shell: bash
        run: go run ./examples/sd-encode -i samples/frames -fps 24 -secs 1 -o /tmp/out.avi
