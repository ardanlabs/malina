name: Windows

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Windows x64. leejet ships stable-diffusion.dll alongside ggml-*.dll in
# the win-avx2-x64 zip. Adding the lib directory to PATH lets the OS
# resolve those sibling DLLs when stable-diffusion.dll is loaded.

jobs:
  test:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Go version pin
        shell: bash
        run: ./.github/scripts/check-go-version.sh

      - name: Install vcredist
        shell: pwsh
        run: |
          curl -o VC_redist.x64.exe -L https://aka.ms/vs/17/release/vc_redist.x64.exe
          Start-Process VC_redist.x64.exe -ArgumentList "/install /quiet /norestart" -Wait

      - name: Setup Malina native environment
        uses: ./.github/actions/setup-malina

      - name: Build examples
        shell: bash
        run: |
          set -e
          for dir in ./examples/*/; do
            if [ -f "$dir/main.go" ]; then
              echo "Building $dir..."
              go build -o /dev/null "$dir"
            fi
          done

      - name: Run unit tests
        run: go test -count=1 ./...

      - name: Run hello example
        run: go run ./examples/hello "a lovely cat"

      - name: Run sd-encode example
        shell: bash
        run: go run ./examples/sd-encode -i examples/samples/frames -fps 24 -secs 1 -o /tmp/out.avi
