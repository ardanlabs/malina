name: Linux

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

# Static and unit feedback does not download native libraries or models. The
# integration job owns the single cached multi-GB model download and retains
# the native SDK and example smoke coverage.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Go version pin
        run: ./.github/scripts/check-go-version.sh
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: gofmt
        run: |
          files="$(git ls-files '*.go')"
          out="$(gofmt -s -d $files)"
          test -z "$out" || { printf '%s\n' "$out"; exit 1; }
      - name: go mod tidy drift
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: staticcheck -checks=all ./...
      - name: Guard example imports
        run: |
          ! grep -R --include='*.go' -F '"github.com/ardanlabs/malina/sdk/malina/sd"' examples
      - name: govulncheck
        run: govulncheck ./...
      - name: go fix drift
        run: |
          out="$(go fix -diff ./...)"
          test -z "$out" || { printf '%s\n' "$out"; exit 1; }
      - name: Build and check BUI
        run: make bui-check
      - name: Build all
        run: go build ./...

  unit:
    name: Unit tests and race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Go version pin
        run: ./.github/scripts/check-go-version.sh
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -count=1 -race ./...

  integration:
    name: FFI integration and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Go version pin
        run: ./.github/scripts/check-go-version.sh
      - name: Setup Malina native environment
        uses: ./.github/actions/setup-malina
      - name: Smoke test server process
        run: ./.github/scripts/server-smoke.sh
      - name: Native and model integration tests
        run: go test -count=1 ./sdk/malina/...
      - name: Build examples
        run: |
          for dir in ./examples/*/; do
            [[ ! -f "$dir/main.go" ]] || go build -o /dev/null "$dir"
          done
      - name: Run hello example
        run: go run ./examples/hello "a lovely cat"
      - name: Run sd-encode example
        run: go run ./examples/sd-encode -i examples/samples/frames -fps 24 -secs 1 -o /tmp/out.avi
