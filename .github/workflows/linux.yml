name: Linux

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux libraries (libstable-diffusion.so + libggml*.so) are pulled from
# leejet/stable-diffusion.cpp by `malina install`. LD_LIBRARY_PATH is set
# so libstable-diffusion.so can resolve its libggml*.so dependencies
# regardless of the RUNPATH the upstream binary was built with.
#
# leejet currently publishes no linux/cuda asset, so these jobs test the CPU
# build. The primary job excludes model-backed tests; the model-test matrix
# downloads and caches each advanced fixture independently.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -s -d .)
          if [ -n "$out" ]; then
            echo "::error::gofmt -s reported diffs:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install static analysis tools
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck -checks=all ./...

      - name: Install malina command
        run: go install .

      - name: Install stable-diffusion.cpp libraries
        # No -v: `malina install` falls back to download.DefaultSDVersion
        # baked into pkg/download. CI never silently tracks leejet's latest
        # tag — bumping that constant in code is the rollover.
        run: malina install -lib $GITHUB_WORKSPACE/lib

      - name: Set MALINA_LIB and LD_LIBRARY_PATH
        # LD_LIBRARY_PATH is required so the dynamic loader can find
        # libggml-base.so / libggml-cpu.so / libggml.so when
        # libstable-diffusion.so is dlopen'd. macOS/Windows don't need this
        # — macOS resolves siblings via the dylib's RUNPATH, and Windows
        # finds DLLs in the same directory automatically (PATH-augmented).
        run: |
          echo "MALINA_LIB=$GITHUB_WORKSPACE/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/lib" >> "$GITHUB_ENV"

      - name: Build all
        run: go build ./...

      - name: Build examples
        run: |
          set -e
          for dir in ./examples/*/; do
            if [ -f "$dir/main.go" ]; then
              echo "Building $dir..."
              go build -o /dev/null "$dir"
            fi
          done

      - name: Run tests (model-backed tests excluded)
        run: go test -count=1 ./...

      - name: Run tests with race detector (model-backed tests excluded)
        # Enforces the concurrency contract documented on Context (and the
        # FFI trampolines in general). Linux-only because the race detector
        # roughly triples runtime and one OS is enough to catch real races
        # in pure-Go and cgo-free FFI code paths.
        run: go test -count=1 -race ./...

      - name: Run sd-encode example
        run: go run ./examples/sd-encode -i samples/frames -fps 24 -secs 1 -o /tmp/out.avi

  model-test:
    name: Model / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ControlNet
            bundles: controlnet-canny-sd1.5
            environment: MALINA_CONTROLNET_TEST_DIR
            fixture: controlnet-canny-sd1.5
            test: TestControlNetGeneration
          - name: Real-ESRGAN
            bundles: realesrgan-x4-anime
            environment: MALINA_UPSCALER_TEST_DIR
            fixture: realesrgan-x4-anime
            test: TestUpscaleImage
          - name: ADetailer
            bundles: adetailer-face-yolov8n
            environment: MALINA_ADETAILER_TEST_DIR
            fixture: adetailer-face-yolov8n
            test: TestADetailImage
          - name: AnimateDiff
            bundles: animatediff-sd1.5
            environment: MALINA_VIDEO_TEST_DIR
            fixture: animatediff-sd1.5
            test: TestGenerateVideoAnimateDiff
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache model fixture
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/models
          key: model-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('pkg/download/bundle.go') }}

      - name: Install malina command
        run: go install .

      - name: Download model fixture
        env:
          MODELS_DIR: ${{ github.workspace }}/models
        run: |
          for bundle in ${{ matrix.bundles }}; do
            malina model pull -y -o "$MODELS_DIR" "$bundle"
          done

      - name: Install stable-diffusion.cpp libraries
        run: malina install -lib $GITHUB_WORKSPACE/lib

      - name: Run model test
        env:
          MALINA_LIB: ${{ github.workspace }}/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib
          FIXTURE_ENVIRONMENT: ${{ matrix.environment }}
          FIXTURE_PATH: ${{ github.workspace }}/models/${{ matrix.fixture }}
          TEST_NAME: ${{ matrix.test }}
        run: |
          export "$FIXTURE_ENVIRONMENT=$FIXTURE_PATH"
          go test -count=1 -v -tags=malina_model_tests -run "^${TEST_NAME}$" ./pkg/sd
